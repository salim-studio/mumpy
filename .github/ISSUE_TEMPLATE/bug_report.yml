name: Bug report
description: Report a reproducible problem with mumpy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: mumpy / Python / OS versions
      placeholder: mumpy 0.2.0, Python 3.11, Windows 11
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest code snippet that shows the bug
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true

name: Feature request
description: Suggest an idea for mumpy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the API you would like, e.g. mp.frame.read_sql(...)
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core/numpy-compat, io, db, frame, stats, preprocessing, metrics, ml, nn, viz, docs, other]

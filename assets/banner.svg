<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="mumpy banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle cx="1020" cy="70" r="150" fill="#06B6D4" opacity="0.12"/>
  <circle cx="120" cy="360" r="120" fill="#4F46E5" opacity="0.18"/>
  <rect x="90" y="110" width="180" height="180" rx="42" fill="url(#lg)"/>
  <text x="122" y="244" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF">m</text>
  <polygon points="226,128 198,186 218,186 206,232 240,170 220,170" fill="#FDE047" stroke="#0B1020" stroke-width="5" stroke-linejoin="round"/>
  <text x="300" y="190" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF" letter-spacing="-2">mumpy</text>
  <text x="302" y="240" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="30" fill="#A5F3FC">NumPy you know. Speed you feel. Tools you need.</text>
  <text x="302" y="282" font-family="Verdana, Geneva, Tahoma, sans-serif" font-size="22" fill="#C7D2FE">numpy-compatible  •  multithreaded  •  DB + DataFrame + ML + DL</text>
</svg>
